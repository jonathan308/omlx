name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
          python -m pip install pytest pytest-asyncio

      - name: Run unit tests
        run: |
          # These safetensors/GDN/embedding suites delete backing files or
          # mutate process-global MLX/model state. Keep each complete file in
          # a fresh process: isolating individual node IDs only moves the stale mapping
          # failure to the next test that evaluates one. The main suite still
          # covers every other test in one process.
          python -m pytest tests/ -m "not slow and not integration" \
            --ignore=tests/test_cluster_prompt_snapshot_cache.py \
            --ignore=tests/test_gdn_sidecar_quantization.py \
            --ignore=tests/test_prefix_cache_gdn_split.py \
            --ignore=tests/test_cluster_ds4_shard_native_adapter.py \
            --ignore=tests/test_cluster_ds4f_tp.py \
            --ignore=tests/test_embedding.py
          python -m pytest -q tests/test_cluster_prompt_snapshot_cache.py -m "not slow and not integration" \
            --deselect=tests/test_cluster_prompt_snapshot_cache.py::test_legacy_cumulative_pooling_snapshot_seeds_a_new_delta_chain \
            --deselect=tests/test_cluster_prompt_snapshot_cache.py::test_the_deepseek_layer_shape_round_trips
          python -m pytest -q tests/test_cluster_prompt_snapshot_cache.py::test_legacy_cumulative_pooling_snapshot_seeds_a_new_delta_chain
          python -m pytest -q tests/test_cluster_prompt_snapshot_cache.py::test_the_deepseek_layer_shape_round_trips
          python -m pytest -q tests/test_gdn_sidecar_quantization.py -m "not slow and not integration"
          python -m pytest -q tests/test_prefix_cache_gdn_split.py -m "not slow and not integration"
          python -m pytest -q tests/test_cluster_ds4_shard_native_adapter.py -m "not slow and not integration"
          python -m pytest -q tests/test_cluster_ds4f_tp.py -m "not slow and not integration"
          python -m pytest -q tests/test_embedding.py -m "not slow and not integration"
